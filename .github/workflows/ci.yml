name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Benchmark correctness smoke (not performance evidence)
        run: |
          cargo bench --locked -p engine --bench scaling -- --test
          cargo build --release --locked -p engine --example measure
          node scripts/benchmark.mjs /tmp/reflective-benchmark-smoke --smoke
          node scripts/verify-benchmark.mjs
      - name: Check production WebAssembly dependencies
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.85.0
          cargo check --workspace --target wasm32-unknown-unknown --locked
      - name: Retain property regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-regressions
          path: crates/**/proptest-regressions/*.txt
          if-no-files-found: ignore
      - name: Portable trace and checked replay smoke checks
        shell: bash
        run: |
          trace_dir=$(mktemp -d)
          cargo run --locked -p cli -- export examples/independent/shared-read.graph --max-steps 2 --conflict-state 0 --output "$trace_dir/independent.json"
          cargo run --locked -p cli -- trace-check "$trace_dir/independent.json"
          cargo run --locked -p cli -- replay "$trace_dir/independent.json" --at 1
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo run --locked -p cli -- demo
      - name: Authored CLI smoke checks
        shell: bash
        run: |
          cargo run --locked -p cli -- check examples/programs/self-modify.graph
          cargo run --locked -p cli -- run examples/programs/arithmetic.graph --max-steps 1
          status=0
          cargo run --locked -p cli -- run examples/programs/self-modify.graph --max-steps 3 || status=$?
          test "$status" -eq 3
          status=0
          cargo run --locked -p cli -- run examples/programs/mutual-regress.graph --max-steps 1 --rule p || status=$?
          test "$status" -eq 4
