name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Local developer API and Firebase persistence acceptance
        run: |
          cargo build --release --locked -p cli
          npm ci --prefix platform --ignore-scripts
          node --test platform/tests/*.test.mjs
          npm run test:emulator --prefix platform
      - name: Large-data importer and experimental matching smoke
        run: |
          node --test scripts/import-study-data.test.mjs
          node --test scripts/research-methods.test.mjs
          node --test scripts/documentation.test.mjs
          node scripts/reproduce-cycle.mjs --verify benchmarks/results/s6-cycle01-reproduction
          node scripts/verify-scale-study.mjs
          node scripts/verify-loop-b.mjs
          node scripts/verify-loop-b2.mjs
          node scripts/verify-loop-c.mjs
          node scripts/verify-recovery-study.mjs
          node scripts/verify-recovery-study.mjs benchmarks/results/recovery-c01
          cargo run --release --locked -p engine --example recovery_probe -- modulating 3 10
          cargo run --release --locked -p engine --example scale_probe -- fixed 1000 bindings-indexed 1 42
          cargo run --release --locked -p engine --example scale_probe -- fixed 1000 pipeline-framed 1000 42 | node -e 'let s="";process.stdin.on("data",b=>s+=b);process.stdin.on("end",()=>{const r=JSON.parse(s);require("node:assert/strict").ok(r.outcome==="NormalForm"&&r.commits===1000&&r.domain_verified&&r.replay_verified);});'
          cargo run --release --locked -p engine --example scale_probe -- guarded 10 run-compact 20 42
      - name: Benchmark correctness smoke (not performance evidence)
        run: |
          cargo bench --locked -p engine --bench scaling -- --test
          cargo build --release --locked -p engine --example measure
          node scripts/benchmark.mjs /tmp/reflective-benchmark-smoke --smoke
          node scripts/verify-benchmark.mjs
      - name: Check production WebAssembly dependencies
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.85.0
          cargo check --workspace --target wasm32-unknown-unknown --locked
      - name: Retain property regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-regressions
          path: crates/**/proptest-regressions/*.txt
          if-no-files-found: ignore
      - name: Portable trace and checked replay smoke checks
        shell: bash
        run: |
          trace_dir=$(mktemp -d)
          cargo run --locked -p cli -- export examples/independent/shared-read.graph --max-steps 2 --conflict-state 0 --output "$trace_dir/independent.json"
          cargo run --locked -p cli -- trace-check "$trace_dir/independent.json"
          cargo run --locked -p cli -- replay "$trace_dir/independent.json" --at 1
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo run --locked -p cli -- demo
      - name: Authored CLI smoke checks
        shell: bash
        run: |
          cargo run --locked -p cli -- check examples/programs/self-modify.graph
          cargo run --locked -p cli -- run examples/programs/arithmetic.graph --max-steps 1
          status=0
          cargo run --locked -p cli -- run examples/programs/self-modify.graph --max-steps 3 || status=$?
          test "$status" -eq 3
          status=0
          cargo run --locked -p cli -- run examples/programs/mutual-regress.graph --max-steps 1 --rule p || status=$?
          test "$status" -eq 4
