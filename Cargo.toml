[workspace]
members = ["crates/graph-core", "crates/engine", "crates/parser", "crates/cli", "crates/wasm-bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
graph-core = { path = "crates/graph-core" }
engine = { path = "crates/engine" }
parser = { path = "crates/parser" }
slotmap = "=1.0.7"
im = "=15.1.0"
logos = "=0.16.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
